<html>
 <head>
     <title>Usuarios Registrados</title>
 </head>
 <body>
     <h1>👥 Usuarios Registrados</h1>
     <table border="1" cellpadding="8">
         <tr>
             <th>ID</th>
             <th>>Nombre</th>
             <th>Correo</th>
         </tr>
         {% for u in usuarios %}
         <tr>
             <td>{{ u[0] }}</td>
             <td>{{ u[1] }}</td>
             <td>{{ u[2] }}</td>
         </tr>
         {% else %}
         <tr>
             <td colspan="3">No hay usuarios registrados aún.</td>
         </tr>
         {% endfor %}
     </table>
 </body>
 </html>
