
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kenesis — Entrenamiento personal</title>

  <link rel="stylesheet" href="/estilos/index.css">
<link
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded"
  rel="stylesheet">

</head>

<body>

  <main class="app">

    <!-- HEADER -->

    <header class="top">

      <div class="brand">
        <img
          class="brand-mark"
          src="../IMG/LOGO.png"
          alt="Logo Kenesis"
        >
        kenesis
      </div>

      <a
        href="/logout"
        class="logout-button"
      >
        Cerrar sesión
      </a>

    </header>


    <!-- SALUDO -->

    <section class="greeting">

      <p >
        {{today}}
      </p>

      <h1>
        Hola, [[NAME]] 👋<br>
        ¿lista para moverte?
      </h1>

    </section>


        <section>

      <div class="section-head">

        <h2>
          Tu semana
        </h2>

        <!-- BOTÓN CALENDARIO -->

        <form
          action="/calendar"
          method="get"
        >

          <button
            type="submit"
            class="calendar-button"
          >
            Calendario
          </button>

        </form>

      </div>


      <!-- DÍAS -->

      <div class="week">

        <form action="/day/15" method="get">
          <button
            class="day"
            type="submit"
          >
            <span>Lun</span>
            <strong>15</strong>
          </button>
        </form>


        <form action="/day/16" method="get">
          <button
            class="day active"
            type="submit"
          >
            <span>Mar</span>
            <strong>16</strong>
          </button>
        </form>


        <form action="/day/17" method="get">
          <button
            class="day"
            type="submit"
          >
            <span>Mié</span>
            <strong>17</strong>
          </button>
        </form>


        <form action="/day/18" method="get">
          <button
            class="day"
            type="submit"
          >
            <span>Jue</span>
            <strong>18</strong>
          </button>
        </form>


        <form action="/day/19" method="get">
          <button
            class="day"
            type="submit"
          >
            <span>Vie</span>
            <strong>19</strong>
          </button>
        </form>


        <form action="/day/20" method="get">
          <button
            class="day"
            type="submit"
          >
            <span>Sáb</span>
            <strong>20</strong>
          </button>
        </form>

      </div>

    </section>


    <!-- PROGRESO -->

    <section>

      <div class="section-head">

        <h2>
          Progreso
        </h2>

      </div>


      <div class="summary">


        <!-- RACHA -->

        <form
          action="/progress/streak"
          method="get"
        >

          <button
            class="stat"
            type="submit"
          >

            <span class="icon">
              🔥
            </span>

            <b>
              [[STREAK]] días
            </b>

            <small>
              racha actual
            </small>

          </button>

        </form>


        <!-- MINUTOS -->

        <form
          action="/progress/minutes"
          method="get"
        >

          <button
            class="stat"
            type="submit"
          >

            <span class="icon">
              ⚡
            </span>

            <b>
              [[MINUTES]] min
            </b>

            <small>
              esta semana
            </small>

          </button>

        </form>


      </div>


      

    </section>


<nav class="bottom-nav">

  <a href="/home" class="nav-button active">
    <span class="nav-icon">
      <span class="material-symbols-rounded">home</span>
    </span>
    <span>Home</span>
  </a>

  <a href="/plan" class="nav-button">
    <span class="nav-icon">
      <span class="material-symbols-rounded">calendar_month</span>
    </span>
    <span>Plan</span>
  </a>

  <a href="/progress" class="nav-button">
    <span class="nav-icon">
      <span class="material-symbols-rounded">monitoring</span>
    </span>
    <span>Progress</span>
  </a>

  <a href="/profile" class="nav-button">
    <span class="nav-icon">
      <span class="material-symbols-rounded">person</span>
    </span>
    <span>Profile</span>
  </a>

</nav>



  </main>

</body>
</html>
