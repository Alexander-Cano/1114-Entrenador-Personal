<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil — Kenesis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('styles', filename='index.css') }}">
</head>
<body>
  <main class="phone-shell">
    <section class="app">
      <header class="top">
        <a class="brand" href="{{ url_for('home') }}"><img class="brand-mark" src="{{ url_for('logo', filename='LOGO.png') }}" alt="Logo Kenesis"><span>kenesis</span></a>
      </header>
      <section class="profile-hero">
        <div class="profile-avatar">{{ user_initials }}</div>
        <p class="eyebrow">Tu perfil</p>
        <h1>{{ user_name }}</h1>
        <p>{{ user_email or "Cuenta de atleta" }}</p>
      </section>
      <div class="summary">
        <div class="stat"><span class="icon">🔥</span><b>{{ streak }}</b><small>días de racha</small></div>
        <div class="stat"><span class="icon">🏋️</span><b>{{ total_sessions }}</b><small>sesiones hechas</small></div>
      </div>
      <section class="settings-card">
        <a href="{{ url_for('nav_plan') }}"><span>▦</span><strong>Mi plan</strong><small>Ver rutinas</small><b>›</b></a>
        <a href="{{ url_for('nav_progress') }}"><span>↗</span><strong>Mis avances</strong><small>Revisar progreso</small><b>›</b></a>
        <a class="danger-link" href="{{ url_for('logout') }}"><span>↪</span><strong>Cerrar sesión</strong><small>Salir de Kenesis</small><b>›</b></a>
      </section>
    </section>
    <nav class="bottom-nav" aria-label="Navegación principal">
      <a href="{{ url_for('home') }}" class="nav-button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 10.8 12 3.8l8.5 7"></path><path d="M5.5 9.5v9h13v-9"></path><path d="M9.5 18.5v-5h5v5"></path></svg></span><span>Inicio</span></a>
      <a href="{{ url_for('nav_plan') }}" class="nav-button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M8 4v16M4 9h16M4 14h16"></path></svg></span><span>Plan</span></a>
      <a href="{{ url_for('nav_progress') }}" class="nav-button"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m4 17 5-5 3 3 6-7"></path><path d="M14 8h4v4"></path></svg></span><span>Progreso</span></a>
      <a href="{{ url_for('nav_profile') }}" class="nav-button active"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c.8-3.2 3.2-5 7-5s6.2 1.8 7 5"></path></svg></span><span>Perfil</span></a>
    </nav>
  </main>
</body>
</html>
