<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kenesis — Entrenamiento personal</title>
  <link rel="stylesheet" href="/estilos/index.css">

</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">
        <img class="brand-mark" src="../IMG/LOGO.png" alt="Logo Kenesis">
        kenesis
      </div>

      <a href="/logout" class="logout-button">Cerrar sesión</a>
    </header>

    <section class="greeting">
      <p class="eyebrow">[[TODAY]]</p>
      <h1>Hola, [[NAME]] 👋<br>¿lista para moverte?</h1>
    </section>

    <section class="hero">
      <span class="hero-label">Entrenamiento de hoy</span>
      <h2>Fuerza de cuerpo completo</h2>
      <p>35 min · Nivel intermedio</p>

      <form action="/start" method="post">
        <button class="start" type="submit">
          <span class="play">▶</span>
          Comenzar
        </button>
      </form>
    </section>

    <section>
      <div class="section-head">
        <h2>Tu semana</h2>
        <button type="button">Calendario</button>
      </div>

      <div class="week">
        <button class="day"><span>Lun</span><strong>15</strong></button>
        <button class="day active"><span>Mar</span><strong>16</strong></button>
        <button class="day"><span>Mié</span><strong>17</strong></button>
        <button class="day"><span>Jue</span><strong>18</strong></button>
        <button class="day"><span>Vie</span><strong>19</strong></button>
        <button class="day"><span>Sáb</span><strong>20</strong></button>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2>Progreso</h2>
      </div>

      <div class="summary">
        <article class="stat">
          <span class="icon">🔥</span>
          <b>[[STREAK]] días</b>
          <small>racha actual</small>
        </article>

        <article class="stat">
          <span class="icon">⚡</span>
          <b>[[MINUTES]] min</b>
          <small>esta semana</small>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
